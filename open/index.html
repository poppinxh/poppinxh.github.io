<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#efe8da">
<title>字相 · 一字之相</title>
<meta name="description" content="问一个字，看它今日之相：拆字、五行、干支、节气、纳音、消息卦与六十四卦，出一页字牒。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#ask">跳到问字</a>

<header class="top">
  <a class="brand" href="./" aria-label="字相 首页">
    <span class="brand__seal" aria-hidden="true">相</span>
    <span class="brand__text">字相<small>ZI XIANG</small></span>
  </a>
  <nav class="top__tools">
    <button class="tool" id="shelfBtn" aria-expanded="false" aria-controls="shelf">
      字牒册 <b id="shelfCount">0</b>
    </button>
    <button class="tool tool--icon" id="soundBtn" aria-pressed="true" aria-label="音效开关">♪</button>
    <button class="tool tool--icon" id="themeBtn" aria-pressed="false" aria-label="切换深浅色">◐</button>
  </nav>
</header>

<main>
  <section class="ask" id="ask">
    <p class="kicker">日与字相会</p>
    <h1>问一个字，<br class="br-lg">看它今日之相。</h1>
    <p class="ask__lede">
      一个字有它的形、它的意、它的五行与九星；一日有它的干支、节气与卦。
      两下相遇，就是这一页字牒。
    </p>

    <div class="ask__row">
      <div class="field field--char">
        <label for="chInput">字</label>
        <input id="chInput" type="text" maxlength="8" placeholder="任写一字"
               autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="field field--date">
        <label for="dateInput">日</label>
        <input id="dateInput" type="date">
      </div>
      <button class="go" id="askBtn" type="button">
        <span>相</span>
      </button>
    </div>

    <div class="ask__hint">
      <span>带日期看它今日之相，清空日期则只解字。</span>
      <span class="ask__dot" aria-hidden="true">·</span>
      <button class="link" id="dateToggle" type="button">清空日期</button>
      <span class="ask__dot" aria-hidden="true">·</span>
      <button class="link" id="sampleBtn" type="button">随手一字</button>
    </div>
  </section>

  <section class="sheet" id="sheet" aria-live="polite" aria-atomic="true"></section>

  <section class="shelf" id="shelf" aria-labelledby="shelfTitle" hidden>
    <div class="shelf__head">
      <h2 id="shelfTitle">字牒册</h2>
      <button class="link" id="clearShelf" hidden>清空</button>
    </div>
    <div class="shelf__grid" id="shelfGrid"></div>
  </section>
</main>

<footer class="foot">
  <span>字相 · 一字之相</span>
  <span>纯前端 · 不联网 · 数据只存在这台设备的浏览器里</span>
</footer>

<canvas id="exportCanvas" width="1000" height="1400" hidden></canvas>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
